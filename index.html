<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صلوات شمار </title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="box">
    <h1>«اللَّهُمَّ صَلِّ عَلَی  مُحَمَّدٍ<br> وَ آلِ مُحَمَّد و عَجِّل فَرَجَهُم»</h1>

    <div id="countDisplay" class="count-display">۰</div>

    <button id="clickBtn" class="click-btn">صلوات</button>

    <div class="secondary-actions">
      <button id="resetBtn">ریست</button>
      <button id="minusBtn">−۱</button>
    </div>

    <p class="best-score">بیشترین صلوات : <strong id="bestCount">۰</strong></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
