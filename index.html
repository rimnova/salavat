<body>

  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>

  <main class="card">

    <div class="arch">
      <svg class="arch-svg" viewBox="0 0 220 170" aria-hidden="true">
        <path class="arch-path" d="M10,168 L10,90 C10,55 40,45 55,45 C40,45 42,10 110,4 C178,10 180,45 165,45 C180,45 210,55 210,90 L210,168" />
      </svg>
      <svg class="dome-svg" viewBox="0 0 100 90" aria-hidden="true">
        <defs>
          <mask id="crescentMask">
            <rect x="0" y="0" width="100" height="100" fill="#fff" />
            <circle cx="57" cy="15" r="7.5" fill="#000" />
          </mask>
        </defs>
        <path class="dome-shape" d="M50,6 Q22,34 31,53 Q37,66 50,66 Q63,66 69,53 Q78,34 50,6 Z" />
        <rect class="dome-base" x="31" y="64" width="38" height="7" rx="2" />
        <circle class="crescent" cx="52" cy="15" r="9" mask="url(#crescentMask)" />
      </svg>
    </div>

    <p id="salawatText" class="salawat" role="button" tabindex="0" aria-label="پخش صلوات صوتی">
      «اللَّهُمَّ صَلِّ عَلَی مُحَمَّدٍ<br>وَ آلِ مُحَمَّد وَ عَجِّل فَرَجَهُم»
      <span class="sound-icon" aria-hidden="true">🔊</span>
    </p>

    <div class="counter-wrap">
      <div id="beadRing" class="bead-ring" aria-hidden="true"></div>
      <div class="count-core">
        <div id="countDisplay" class="count-display">۰</div>
        <div class="round-label">دور <span id="roundCount">۰</span> از ۳۳</div>
      </div>
    </div>

    <button id="clickBtn" class="click-btn" aria-label="ثبت صلوات">
      <span>صلوات</span>
    </button>

    <div class="secondary-actions">
      <button id="minusBtn" class="ghost-btn" aria-label="کم کردن یک عدد">−۱</button>
      <button id="resetBtn" class="ghost-btn" aria-label="شروع دوباره">ریست</button>
    </div>

    <p class="best-score">بیشترین صلوات&nbsp;<strong id="bestCount">۰</strong></p>

  </main>

  <script src="script.js"></script>
