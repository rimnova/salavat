name: Build Salavat Android AAB

on:
  push:
    branches: [main]
    paths:
      - "webapp/**"
      - "android/**"
      - ".github/workflows/android-aab.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build signed TWA
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.5"
          check-latest: false

      - name: Verify environment
        run: |
          set -euo pipefail

          echo "Node:"
          node --version

          echo "npm:"
          npm --version

          echo "Java:"
          java -version

          echo "JAVA_HOME:"
          echo "$JAVA_HOME"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail

          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Bubblewrap
        run: |
          set -euo pipefail

          npm install --global @bubblewrap/cli@1.24.1

          echo "Bubblewrap version:"
          bubblewrap --version

          echo "Bubblewrap location:"
          which bubblewrap

      - name: Configure Bubblewrap
        run: |
          set -euo pipefail

          mkdir -p "$HOME/.bubblewrap"

          test -n "${JAVA_HOME:-}" || {
            echo "::error::JAVA_HOME is not set"
            exit 1
          }

          test -n "${ANDROID_HOME:-}" || {
            echo "::error::ANDROID_HOME is not set"
            exit 1
          }

          test -x "$JAVA_HOME/bin/java" || {
            echo "::error::JDK 17 was not found"
            exit 1
          }

          test -d "$ANDROID_HOME" || {
            echo "::error::Android SDK was not found"
            exit 1
          }

          cat > "$HOME/.bubblewrap/config.json" <<EOF
{
  "jdkPath": "$JAVA_HOME",
  "androidSdkPath": "$ANDROID_HOME"
}
EOF

          echo "Bubblewrap config:"
          cat "$HOME/.bubblewrap/config.json"

      - name: Verify Bubblewrap configuration
        run: |
          set -euo pipefail

          bubblewrap doctor

      - name: Prepare release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$ANDROID_KEYSTORE_BASE64" || {
            echo "::error::Missing ANDROID_KEYSTORE_BASE64"
            exit 1
          }

          test -n "$ANDROID_KEYSTORE_PASSWORD" || {
            echo "::error::Missing ANDROID_KEYSTORE_PASSWORD"
            exit 1
          }

          test -n "$ANDROID_KEY_PASSWORD" || {
            echo "::error::Missing ANDROID_KEY_PASSWORD"
            exit 1
          }

          mkdir -p android

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/android-keystore

          chmod 600 android/android-keystore

          keytool -list \
            -keystore android/android-keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias android >/dev/null

          echo "Release keystore verified."
          echo "Alias: android"

      - name: Generate TWA project
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          rm -f twa-manifest.jsonrary project configuration.
          mv android-keystore android-keystore.release

          printf '\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n' \
            | bubblewrap init \
                --manifest="https://rimnova.github.io/salavat/webapp/manifest.json" \
                --directory="."

          # Remove the temporary keystore generated by init.
          rm -f android-keystore

          # Restore the real release keystore.
          mv android-keystore.release android-keystore

          test -f twa-manifest.json || {
            echo "::error::Bubblewrap did not generate twa-manifest.json"
            exit 1
          }

      - name: Configure TWA manifest
        working-directory: android
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('fs');

          const file = 'twa-manifest.json';
          const manifest = JSON.parse(fs.readFileSync(file, 'utf8'));

          manifest.packageId = 'ir.rimnova.salavat';
          manifest.appVersionCode = 1;
          manifest.appVersion = '1.0.0';
          manifest.appVersionName = '1.0.0';

          manifest.signingKey = {
            ...(manifest.signingKey || {}),
            path: './android-keystore',
            alias: 'android'
          };

          fs.writeFileSync(
            file,
            JSON.stringify(manifest, null, 2) + '\n'
          );

          console.log('TWA manifest configured:');
          console.log(JSON.stringify({
            packageId: manifest.packageId,
            appVersionCode: manifest.appVersionCode,
            appVersion: manifest.appVersion,
            appVersionName: manifest.appVersionName,
            signingKey: manifest.signingKey
          }, null, 2));
          NODE

      - name: Update TWA project
        working-directory: android
        run: |
          set -euo pipefail

          bubblewrap update \
            --manifest="twa-manifest.json" \
            --skipVersionUpgrade

      - name: Verify release keystore
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          test -f android-keystore || {
            echo "::error::Release keystore is missing"
            exit 1
          }

          keytool -list \
            -keystore android-keystore \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias android >/dev/null

          echo "Release keystore verified successfully."

      - name: Build signed AAB and APK
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          bubblewrap build \
            --manifest="twa-manifest.json" \
            --signingKeyPath="./android-keystore" \
            --signingKeyAlias="android" \
            --skipPwaValidation

      - name: Verify build outputs
        working-directory: android
        run: |
          set -euo pipefail

          echo "Generated Android files:"
          find . -maxdepth 2 -type f \
            \( -name "*.aab" -o -name "*.apk" \) \
            -print

          test -f app-release-bundle.aab || {
            echo "::error::AAB was not generated"
            exit 1
          }

          test -f app-release-signed.apk || {
            echo "::error::APK was not generated"
            exit 1
          }

          echo "AAB:"
          ls -lh app-release-bundle.aab

          echo "APK:"
          ls -lh app-release-signed.apk

      - name: Generate release certificate fingerprint
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail

          FP="$(
            keytool -list -v \
              -keystore android-keystore \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              -alias android \
              | awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          test -n "$FP" || {
            echo "::error::Could not extract SHA-256 certificate fingerprint"
            exit 1
          }

          cat > assetlinks.json <<EOF
[
  {
    "relation": [
      "delegate_permission/common.handle_all_urls"
    ],
    "target": {
      "namespace": "android_app",
      "package_name": "ir.rimnova.salavat",
      "sha256_cert_fingerprints": [
        "$FP"
      ]
    }
  }
]
EOF

          echo "Release certificate SHA-256:"
          echo "$FP"

          echo
          echo "assetlinks.json:"
          cat assetlinks.json

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: salavat-android-aab
          path: android/app-release-bundle.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: salavat-android-apk
          path: android/app-release-signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Digital Asset Links
        uses: actions/upload-artifact@v4
        with:
          name: salavat-assetlinks
          path: android/assetlinks.json
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/android-keystore
          rm -f android/android-keystore.release
          rm -f manifest-checksum.txt

          # Keep the real release keystore safe while Bubblewrap init
          # generates its tempo
